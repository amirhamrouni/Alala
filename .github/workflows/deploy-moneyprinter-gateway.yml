name: Deploy MoneyPrinter Gateway

on:
  push:
    branches: [main]
    paths:
      - "moneyprinter-mobile-gateway/**"
      - ".github/workflows/deploy-moneyprinter-gateway.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.MONEYPRINTER_SSH_HOST }}
          username: ${{ secrets.MONEYPRINTER_SSH_USER }}
          key: ${{ secrets.MONEYPRINTER_SSH_KEY }}
          script: |
            cd ${{ secrets.MONEYPRINTER_APP_DIR }}
            git pull
            cd moneyprinter-mobile-gateway
            docker compose up -d --build
